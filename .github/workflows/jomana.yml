name: Hello World Workflow

on:
  push:
    branches:
      - master
      - main

jobs:
  say-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Echo Hello World
        run: echo "Hello World"

  celebrate-success:
    runs-on: ubuntu-latest
    needs: say-hello # This ensures this job waits for 'say-hello' to finish successfully

    steps:
      - name: Echo Success Message
        run: echo "Job 1 finished successfully! 🎉"
